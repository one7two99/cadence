<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="cadence-icon-title cadence-icon-desc">
  <title id="cadence-icon-title">Cadence</title>
  <desc id="cadence-icon-desc">The Cadence keyboard layout mark — Sweep geometry as a dot grid with amber accents on the T and N positions.</desc>

  <style>
    .ink   { fill: #2A2520; }
    .amber { fill: #EF9F27; }
    .paper { fill: #FAF6EE; }
    .border { fill: none; stroke: #ECE3D0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #F0EDE5; }
      .paper { fill: #1F1B16; }
      .border { stroke: #44403A; }
    }
  </style>

  <!-- Rounded-square keycap-like background -->
  <rect x="2" y="2" width="124" height="124" rx="20" class="paper"/>
  <rect x="2" y="2" width="124" height="124" rx="20" class="border"/>

  <!-- The keyboard mark, centered.
       Mark dimensions in source coords: 96 wide × 26 tall.
       To fit nicely in 128×128 with padding, scale by ~1.0 and center.
       Mark center: (48, 13). Place at (64, 64) of the icon.
       Translate offset: (64-48, 64-13) = (16, 51) -->
  <g transform="translate(16 51)">
    <!-- Left half alphas -->
    <circle cx="0"  cy="0"  r="3" class="ink"/>
    <circle cx="8"  cy="0"  r="3" class="ink"/>
    <circle cx="16" cy="0"  r="3" class="ink"/>
    <circle cx="24" cy="0"  r="3" class="ink"/>
    <circle cx="32" cy="0"  r="3" class="ink"/>

    <circle cx="0"  cy="8"  r="3" class="ink"/>
    <circle cx="8"  cy="8"  r="3" class="ink"/>
    <circle cx="16" cy="8"  r="3" class="ink"/>
    <circle cx="24" cy="8"  r="4" class="amber"/>
    <circle cx="32" cy="8"  r="3" class="ink"/>

    <circle cx="0"  cy="16" r="3" class="ink"/>
    <circle cx="8"  cy="16" r="3" class="ink"/>
    <circle cx="16" cy="16" r="3" class="ink"/>
    <circle cx="24" cy="16" r="3" class="ink"/>
    <circle cx="32" cy="16" r="3" class="ink"/>

    <!-- Left thumbs -->
    <circle cx="32" cy="26" r="3" class="ink"/>
    <circle cx="40" cy="26" r="3" class="ink"/>

    <!-- Right half alphas -->
    <circle cx="64" cy="0"  r="3" class="ink"/>
    <circle cx="72" cy="0"  r="3" class="ink"/>
    <circle cx="80" cy="0"  r="3" class="ink"/>
    <circle cx="88" cy="0"  r="3" class="ink"/>
    <circle cx="96" cy="0"  r="3" class="ink"/>

    <circle cx="64" cy="8"  r="3" class="ink"/>
    <circle cx="72" cy="8"  r="4" class="amber"/>
    <circle cx="80" cy="8"  r="3" class="ink"/>
    <circle cx="88" cy="8"  r="3" class="ink"/>
    <circle cx="96" cy="8"  r="3" class="ink"/>

    <circle cx="64" cy="16" r="3" class="ink"/>
    <circle cx="72" cy="16" r="3" class="ink"/>
    <circle cx="80" cy="16" r="3" class="ink"/>
    <circle cx="88" cy="16" r="3" class="ink"/>
    <circle cx="96" cy="16" r="3" class="ink"/>

    <!-- Right thumbs -->
    <circle cx="56" cy="26" r="3" class="ink"/>
    <circle cx="64" cy="26" r="3" class="ink"/>
  </g>
</svg>
